<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Verse1 FX — 切点过渡特效层（涟漪/柱影遮挡/黑羽过切）</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  .clip { position: absolute; }
  #root { width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="v1-fx"
       data-width="1920"
       data-height="1080">
    <canvas id="fx" class="clip" width="1920" height="1080"
            data-start="0" data-duration="15.93" data-track-index="0"
            data-layout-ignore></canvas>
  </div>

<script>
/* 过渡层：覆盖在四个镜头之上的切点特效，时间为镜头内局部时间（=全局-38）
   4.36  涟漪转场（蔷薇→肖像，匹配剪辑的"水面"感）
   8.11  柱影遮挡转场（→古书）：巨大暗柱扫过，切点藏在全遮瞬间
   13.22 黑羽过切（→棺椁）：羽毛从镜头3末飘入、镜头4初飘出
   全部为 t 的纯函数。 */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
window.__timelines["v1-fx"] = tl;

const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const W = 1920, H = 1080;
const clamp01 = v => Math.min(1, Math.max(0, v));
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- 涟漪 @4.36 ---------- */
function drawRipple(t) {
  const u = t - 4.36;
  if (u < 0 || u > 1.0) return;
  const cx = 960, cy = 500;
  // 起手一点冷光，帮助切点
  if (u < 0.22) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 320);
    g.addColorStop(0, `rgba(214,230,255,${0.1 * (1 - u / 0.22)})`);
    g.addColorStop(1, "rgba(214,230,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - 320, cy - 320, 640, 640);
  }
  for (let i = 0; i < 2; i++) {
    const d = (u - i * 0.13) / 0.85;
    if (d <= 0 || d >= 1) continue;
    const r = 40 + easeOut(d) * 760;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(206,224,252,${(0.5 * Math.pow(1 - d, 1.6)).toFixed(3)})`;
    ctx.lineWidth = 2.2 - d * 1.2;
    ctx.stroke();
  }
}

/* ---------- 柱影遮挡 @8.11（切点=全遮时刻） ---------- */
function drawColumn(t) {
  const u = t - 7.86;
  if (u < 0 || u > 0.82) return;
  const width = 1000;
  // 柱心从屏外 -width 扫到 W+width，切点(u=.25)正好覆盖画面中央
  const x = -width + easeOut(u) * (W + width * 2);
  const grad = ctx.createLinearGradient(x, 0, x + width, 0);
  grad.addColorStop(0, "rgba(2,3,8,0)");
  grad.addColorStop(0.22, "rgba(2,3,8,1)");
  grad.addColorStop(0.78, "rgba(2,3,8,1)");
  grad.addColorStop(1, "rgba(2,3,8,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(x, -100, width, H + 200);
}

/* ---------- 黑羽过切 @13.22 ---------- */
const featherRnd = mulberry32(777);
const feathers = [];
for (let i = 0; i < 6; i++) {
  feathers.push({
    delay: -0.28 + i * 0.09,
    y0: 180 + featherRnd() * 620,
    len: 120 + featherRnd() * 90,
    rot: -0.5 + featherRnd() * 1.0,
    flutter: featherRnd() * Math.PI * 2,
    depth: 0.7 + featherRnd() * 0.5   // 近大远小
  });
}

function drawFeatherShape(x, y, len, rot, flutter) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot + Math.sin(flutter) * 0.22);
  ctx.scale(len / 120, len / 120);
  ctx.beginPath();
  // 羽身：泪滴形，羽轴为中轴
  ctx.moveTo(0, -70);
  ctx.bezierCurveTo(34, -30, 26, 34, 0, 70);
  ctx.bezierCurveTo(-26, 34, -34, -30, 0, -70);
  ctx.closePath();
  ctx.fillStyle = "rgba(4,5,10,.97)";
  ctx.fill();
  ctx.strokeStyle = "rgba(190,210,245,.22)";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // 羽轴
  ctx.beginPath();
  ctx.moveTo(0, -66);
  ctx.lineTo(0, 72);
  ctx.strokeStyle = "rgba(190,210,245,.3)";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function drawFeathers(t) {
  const u = t - 13.22;
  for (const f of feathers) {
    const d = (u - f.delay) / 1.15;
    if (d <= 0 || d >= 1) continue;
    // 从右上飘向左下，越过切点
    const x = W + 260 - easeOut(d) * (W + 520);
    const y = f.y0 + d * 260 + Math.sin(d * 7 + f.flutter) * 40;
    const alpha = Math.sin(d * Math.PI); // 两端淡入淡出
    ctx.globalAlpha = alpha.toFixed(3);
    drawFeatherShape(x, y, f.len * f.depth, f.rot, t * 3 + f.flutter);
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  drawRipple(t);
  drawColumn(t);
  drawFeathers(t);
}

const state = { t: 0 };
tl.to(state, { t: 15.93, duration: 15.93, ease: "none",
               onUpdate: () => draw(state.t) }, 0);
draw(0);
</script>
</body>
</html>
