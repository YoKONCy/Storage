<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Chorus1 Shot3 — あなたへ捧ぐ 最後の祈り (81.46-85.77)</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  .clip { position: absolute; }
  #root { width: 1920px; height: 1080px; overflow: hidden; }

  .actor { position: absolute; will-change: opacity, transform; }
  .actor img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .sil { filter: brightness(.12) saturate(.25) contrast(1.5); }
  .rim { mix-blend-mode: screen; }

  /* A2 絶唱胸像近景（图比 .75）：脸在屏上 1/3，盒底出屏 */
  #singer {
    width: 820px; height: 1093px;
    left: 550px; top: 120px;
    opacity: 0;
  }

  /* 深渊暗红自下方涌上，染她下颌与交握的手（screen 在演员之上） */
  #red-up {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(150,20,28,.55) 0%, rgba(110,12,20,.22) 30%, rgba(0,0,0,0) 56%);
    mix-blend-mode: screen;
    opacity: .15;
  }
  /* 仰面面光：深渊火光自下托起她的脸（光心 970,350），让五官从发环黑中浮起 */
  #face-hot {
    position: absolute; inset: 0;
    background: radial-gradient(30% 36% at 50.5% 32.5%,
      rgba(224,84,48,.5) 0%, rgba(150,26,28,.18) 48%, rgba(0,0,0,0) 74%);
    mix-blend-mode: screen;
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="root" data-composition-id="c1-shot3" data-width="1920" data-height="1080">
    <div id="singer" class="clip actor"
         data-start="0" data-duration="4.31" data-track-index="1">
      <img class="sil" src="assets/images/girl-singing.png" alt="">
      <img class="rim" id="rimL" src="assets/rim/girl-singing-rimL.png" alt="">
      <img class="rim" id="rimR" src="assets/rim/girl-singing-rimR.png" alt="">
    </div>
    <div id="red-up" class="clip"
         data-start="0" data-duration="4.31" data-track-index="4"
         data-layout-ignore></div>
    <div id="face-hot" class="clip"
         data-start="0" data-duration="4.31" data-track-index="5"
         data-layout-ignore></div>
  </div>

<script>
/* 局部 0-4.31s（全局 81.46-85.77）
   暗红柔闪（fx）中切到她的絶唱近景：仰面闭眼、张口唱最后の祈り；
   她仍在缓缓下沉，深渊红光自下方吞上轮廓，到 85.77 落底冲击时切走。 */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
window.__timelines["c1-shot3"] = tl;

const singer = document.getElementById("singer");
const rimL = document.getElementById("rimL");
const rimR = document.getElementById("rimR");
const redUp = document.getElementById("red-up");
const faceHot = document.getElementById("face-hot");
const D = 4.31;

const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = (a, b, x) => { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); };

function draw(t) {
  const enter = smooth(0, .55, t);
  // 自下沉中进入：y+30 → 0，并继续缓沉 26px
  const y = 30 * (1 - enter) + 26 * smooth(.5, D, t);
  singer.style.transform = `translateY(${y.toFixed(1)}px)`;
  singer.style.opacity = enter.toFixed(3);
  // 歌唱时轮廓随乐句轻微起伏
  const sing = .9 + .1 * Math.sin(t * 4.6);
  rimL.style.opacity = (.55 * enter * sing).toFixed(3);
  rimR.style.opacity = (.5 * enter * sing).toFixed(3);
  redUp.style.opacity = (.15 + .45 * smooth(.8, D, t)).toFixed(3);
  faceHot.style.opacity = (enter * (.26 + .08 * Math.sin(t * 4.6))).toFixed(3);
}

const state = { t: 0 };
tl.to(state, { t: D, duration: D, ease: "none",
               onUpdate: () => draw(state.t) }, 0);
draw(0);
</script>
</body>
</html>
