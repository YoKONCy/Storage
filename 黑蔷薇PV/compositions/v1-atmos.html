<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Verse1 Atmos — 持久大气层：浮尘/冷雾/风（38.0-53.93）</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  .clip { position: absolute; }
  #root { width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="v1-atmos"
       data-width="1920"
       data-height="1080">
    <canvas id="atmos" class="clip" width="1920" height="1080"
            data-start="0" data-duration="15.93" data-track-index="0"
            data-layout-ignore></canvas>
  </div>

<script>
/* 大气是 t 的纯函数：
   - 42 粒冷尘：缓慢上浮右漂；镜头4（内部 t≈13.0-15.6）风起，整体加速斜掠
   - 3 团底部冷雾：大半径弱径向，缓慢呼吸
   全部确定性，无 Math.random */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
window.__timelines["v1-atmos"] = tl;

const canvas = document.getElementById("atmos");
const ctx = canvas.getContext("2d");
const W = 1920, H = 1080;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rnd = mulberry32(20260928);
const motes = [];
for (let i = 0; i < 42; i++) {
  motes.push({
    x: rnd() * W,
    y: rnd() * H,
    r: 0.7 + rnd() * 1.9,
    vx: 4 + rnd() * 9,          // 基础漂移 px/s
    rise: 3 + rnd() * 8,        // 上浮 px/s
    ph: rnd() * Math.PI * 2,    // 闪烁相位
    a: 0.05 + rnd() * 0.16
  });
}
const fogs = [
  { x: 380,  y: 980, r: 560, vx: 10, ph: 0.0, a: .05 },
  { x: 1180, y: 1030, r: 680, vx: -8, ph: 2.1, a: .045 },
  { x: 760,  y: 900, r: 460, vx: 6,  ph: 4.2, a: .035 }
];

const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = (a, b, x) => { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); };

function draw(t) {
  ctx.clearRect(0, 0, W, H);

  // 风包络：镜头4 系缎带前后（内部 12.8s 起，15.4s 收）
  const wind = smooth(12.8, 13.5, t) * (1 - smooth(15.2, 15.9, t));

  // 冷雾
  for (const f of fogs) {
    const fx = f.x + f.vx * t + Math.sin(t * 0.18 + f.ph) * 46;
    const fy = f.y + Math.sin(t * 0.13 + f.ph) * 20;
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, f.r);
    g.addColorStop(0, `rgba(140,165,215,${f.a})`);
    g.addColorStop(1, "rgba(140,165,215,0)");
    ctx.fillStyle = g;
    ctx.fillRect(fx - f.r, fy - f.r, f.r * 2, f.r * 2);
  }

  // 浮尘
  for (const m of motes) {
    const sp = m.vx + wind * (150 + m.vx * 7);
    let x = (m.x + sp * t) % (W + 60);
    if (x < -30) x += W + 60;
    const y = m.y - m.rise * t - wind * 26 * t;
    let yy = y % (H + 60);
    if (yy < -30) yy += H + 60;
    const tw = 0.55 + 0.45 * Math.sin(t * 1.4 + m.ph);
    ctx.beginPath();
    ctx.arc(x, yy, m.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(206,222,250,${(m.a * tw * (1 + wind * 1.6)).toFixed(3)})`;
    ctx.fill();
  }
}

const state = { t: 0 };
tl.to(state, { t: 15.93, duration: 15.93, ease: "none",
               onUpdate: () => draw(state.t) }, 0);
draw(0);
</script>
</body>
</html>
