<script>
/* ============================================================
 * Intro 三幕（叙事化返工版）：
 *  A 0-9s    黑而不空：开场 1s 褪黑 → 雨幕 + 花苞心跳红光，
 *            3.5s/6.5s 两次远雷，天际线呼吸
 *  B 9-20s   闪电揭示：9.5s 主闪电照亮雨夜教堂（尖拱/玫瑰窗/尖塔），
 *            13/16.3/19s 三次递进闪电，余晖中空间不完全归零
 *  C 20-38s  红集结：镜头缓拉下移，棺椁从底部显形——黑蔷薇供于棺前；
 *            红雾/余烬上浮/红闪/震屏；24-33s 曲名铭文；
 *            37.8s 全白 → 匹配剪辑进入 Verse 的教堂内景
 * 所有画面为 t 的纯函数；拍点事件内联自 beats/*.json
 * ============================================================ */

// [时间秒, 强度0-1]，仅 Intro 段（来源：hyperframes beats）
const BEATS = [
  [0.715,.61],[0.875,.62],[1.248,.38],[1.515,.31],[1.803,.30],[2.069,.38],
  [2.347,.31],[2.624,.32],[2.891,.47],[3.157,.41],[3.456,.43],[3.723,.38],
  [3.840,.34],[3.989,.39],[4.128,.39],[4.267,.35],[4.416,.36],[4.821,.51],
  [5.099,.59],[5.323,.59],[5.632,.36],[5.920,.31],[6.197,.30],[6.464,.30],
  [6.752,.33],[6.997,.49],[7.264,.57],[7.552,.51],[7.829,.47],[8.128,.43],
  [8.405,.44],[8.672,.34],[8.960,.37],[9.483,.57],[9.920,.43],[10.080,.46],
  [10.336,.33],[10.613,.32],[10.869,.42],[11.136,.37],[11.413,.52],[11.520,.52],
  [11.701,.57],[12.224,.57],[12.789,.51],[13.067,.50],[13.749,.50],[14.315,.50],
  [14.709,.42],[14.987,.59],[15.275,.50],[15.413,.58],[15.520,.61],[16.107,.61],
  [16.224,.57],[16.875,.52],[17.045,.55],[17.717,.61],[18.144,.60],[18.560,.35],
  [18.816,.26],[19.093,.36],[19.243,.29],[19.381,.36],[19.936,.52],[20.043,.47],
  [20.160,.51],[20.437,.55],[20.832,.54],[21.227,.52],[21.867,.54],[22.368,.57],
  [23.051,.58],[23.435,.53],[23.595,.53],[24.000,.57],[24.512,.61],[25.227,.49],
  [25.643,.52],[25.984,.54],[26.219,.54],[26.976,.56],[27.285,.54],[27.808,.52],
  [28.064,.61],[28.352,.52],[28.480,.51],[28.885,.60],[30.411,.49],[30.539,.55],
  [31.349,.54],[32.725,.63],[34.059,.54],[35.445,.59],[36.139,.59],[36.256,.56],
  [37.077,.56],[37.749,.65],[37.909,.56]
];

// 拍点冲击包络：t 时刻所有拍点衰减核之和
function punchEnv(t, t0, t1, decay, thresh) {
  let e = 0;
  for (const [bt, s] of BEATS) {
    if (bt < t0 - 0.5 || bt > t1 + 0.5 || s < thresh) continue;
    const dt = Math.abs(t - bt);
    if (dt < decay * 4) e += s * Math.exp(-dt / decay);
  }
  return Math.min(1.4, e);
}

/* ===== 闪电事件表（手工编排，承担叙事揭示，不靠随机拍点）=====
 * 远雷只亮天际；主闪电照亮整座教堂；主闪后 0.12s 带一次真实的二次回闪 */
const STRIKES = [
  [ 3.50, .10, .60],   // 远雷 1：仅天际呼吸
  [ 6.50, .17, .55],   // 远雷 2：建筑轮廓一闪即逝（预告）
  [ 9.50, .92, .26],   // 主闪电：空间揭示
  [ 9.63, .42, .22],   // └回闪
  [13.00, .56, .26],
  [16.30, .74, .28],
  [19.00, .62, .24]
];

// 返回 { core: 锐利闪峰, glow: 余晖 } 均 0-1
function strikeEnv(t) {
  let core = 0, glow = 0;
  for (const [bt, s, decay] of STRIKES) {
    const dt = t - bt;
    if (dt < -0.05 || dt > 1.6) continue;
    if (dt >= 0 && dt < 0.075) core = Math.max(core, s * (1 - dt / 0.075 * 0.25));
    if (dt >= 0) glow = Math.max(glow, s * Math.exp(-dt / decay));
  }
  return { core, glow: Math.min(1, glow) };
}

const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = (a, b, x) => { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); };

// 确定性伪随机
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const flashLayer = document.getElementById("flash-layer");
const fadeBlack = document.getElementById("fade-black");

const rose = document.getElementById("rose");
const glow = document.getElementById("glow");
const coffin = document.getElementById("coffin");

const stormRimR = document.getElementById("storm-rimR");

const coffinEdge = document.getElementById("coffin-edge");
const coffinLine = document.getElementById("coffin-line");
const titleCard = document.getElementById("title-card");
const titleBack = document.getElementById("title-back");
const decoL = document.querySelector(".deco .ln:not(.r)");
const decoR = document.querySelector(".deco .ln.r");
const diamond = document.querySelector(".deco .diamond");
const W = 1920, H = 1080;

// 教堂结构节点缓存（每帧只改 fill/stroke，不触发布局）
const masonry = document.querySelectorAll(".masonry");
const windows = document.querySelectorAll(".window");
const masonryLines = document.querySelectorAll(".masonry-line");
const windowBars = document.querySelectorAll(".window-bar");

// 雨滴池：位置由种子决定，运动是 t 的线性函数（seek 安全）
const drops = [];
{
  const r = rng(4242);
  for (let i = 0; i < 260; i++) {
    drops.push({
      x: r() * (W + 400) - 200,
      y0: r() * (H + 600) - 300,
      len: 18 + r() * 46,
      spd: 900 + r() * 700,
      layer: r()           // 层级：速度/透明度差
    });
  }
}

function drawRain(t, density, wind, alpha, bolt) {
  ctx.lineCap = "round";
  const n = Math.floor(drops.length * density);
  // 闪电瞬间雨丝被照成冷银色
  const lit = clamp01(bolt * 1.1);
  for (let i = 0; i < n; i++) {
    const d = drops[i];
    const y = ((d.y0 + d.spd * t) % (H + 600)) - 300;
    const x = d.x + wind * (y - d.y0) * 0.35;
    const a = alpha * (0.3 + d.layer * 0.7) * (1 + lit * 1.6);
    const cr = Math.round(150 + lit * 60);
    const cg = Math.round(180 + lit * 55);
    const cb = Math.round(210 + lit * 45);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${clamp01(a).toFixed(3)})`;
    ctx.lineWidth = 0.8 + d.layer * 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - wind * d.len * 0.5, y + d.len);
    ctx.stroke();
  }
}

// 红雾：若干低频漂移的径向光斑
const fogBlobs = [];
{
  const r = rng(777);
  for (let i = 0; i < 9; i++) {
    fogBlobs.push({
      x: r() * W, y: H * (0.55 + r() * 0.5),
      rad: 380 + r() * 520,
      ph: r() * Math.PI * 2,
      spd: 0.05 + r() * 0.09,
      a: 0.5 + r() * 0.5
    });
  }
}

function drawFog(t, amount) {
  if (amount <= 0.001) return;
  for (const b of fogBlobs) {
    const x = b.x + Math.sin(t * b.spd + b.ph) * 140;
    const y = b.y + Math.cos(t * b.spd * 0.7 + b.ph) * 60;
    const pulse = 0.75 + 0.25 * Math.sin(t * 0.8 + b.ph);
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.rad);
    g.addColorStop(0, `rgba(120,8,24,${0.16 * amount * b.a * pulse})`);
    g.addColorStop(1, "rgba(120,8,24,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - b.rad, y - b.rad, b.rad * 2, b.rad * 2);
  }
  // 底部弥漫的暗红雾幕
  const g2 = ctx.createLinearGradient(0, H * 0.45, 0, H);
  g2.addColorStop(0, "rgba(60,0,10,0)");
  g2.addColorStop(1, `rgba(90,4,16,${0.5 * amount})`);
  ctx.fillStyle = g2;
  ctx.fillRect(0, H * 0.45, W, H * 0.55);
}

/* ===== 余烬：C 幕从棺后升起的暗红火星（灵魂意象的伏笔）===== */
const embers = [];
{
  const r = rng(5151);
  for (let i = 0; i < 34; i++) {
    embers.push({
      x: 420 + r() * 1080,
      y0: 880 + r() * 220,
      spd: 14 + r() * 34,
      drift: 18 + r() * 46,
      ph: r() * Math.PI * 2,
      size: 1.4 + r() * 2.2,
      tw: 1.4 + r() * 2.6
    });
  }
}

function drawEmbers(t, amount) {
  if (amount <= 0.001) return;
  for (const e of embers) {
    const span = 1100;
    let y = e.y0 - e.spd * (t - 20);
    if (y < -20) y += ((e.y0 + 20) + span);   // 循环回收
    if (y > H + 20) continue;
    const x = e.x + Math.sin(t * 0.5 + e.ph) * e.drift
              + (t - 20) * 3.2;               // 整体随风微偏
    if (x < -20 || x > W + 20) continue;
    const tw = 0.55 + 0.45 * Math.sin(t * e.tw + e.ph);
    const a = amount * tw * clamp01((y - 60) / 120) * 0.9;
    const g = ctx.createRadialGradient(x, y, 0, x, y, e.size * 4);
    g.addColorStop(0, `rgba(255,118,70,${(a).toFixed(3)})`);
    g.addColorStop(0.4, `rgba(200,48,36,${(a * .6).toFixed(3)})`);
    g.addColorStop(1, "rgba(120,10,12,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - e.size * 4, y - e.size * 4, e.size * 8, e.size * 8);
  }
}

function drawGrain(frame) {
  const r = rng(31337 + frame);
  ctx.fillStyle = "rgba(200,210,230,0.045)";
  for (let i = 0; i < 160; i++) {
    ctx.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2);
  }
}

const state = { t: 0 };

function draw() {
  const t = state.t;
  const frame = Math.round(t * 30);
  ctx.clearRect(0, 0, W, H);

  // ---- 三幕包络 ----
  const actB = smooth(8.4, 9.6, t) * (1 - smooth(19.5, 21.0, t)); // 冷闪窗口
  const actC = smooth(19.5, 23.0, t);                            // 红雾段
  const rainDensity = 0.34 + 0.42 * smooth(1.2, 14, t) + 0.24 * actC;
  const wind = 6 + 22 * smooth(14, 26, t);

  // 闪电：远雷 + 主闪 + 回闪
  const strike = strikeEnv(t);
  const bolt = clamp01(strike.core * 0.9 + strike.glow);

  // ---- 震屏（C 幕，拍点冲击驱动） ----
  const punch = punchEnv(t, 20, 37.7, 0.13, 0.45) * actC;
  const jx = Math.sin(t * 93.0) * punch * 10 + Math.sin(t * 47.3) * punch * 5;
  const jy = Math.cos(t * 71.0) * punch * 8;

  ctx.save();
  ctx.translate(jx, jy);

  // ---- 闪电天光：锐利峰 + 余晖分开，压顶冷光 + 湿地面冷反光 ----
  const skyA = strike.core * .20 + strike.glow * .07;
  const groundA = strike.core * .12 + strike.glow * .03;
  if (skyA > 0.003) {
    const sg = ctx.createLinearGradient(0, -40, 0, 520);
    sg.addColorStop(0, `rgba(150,178,226,${skyA.toFixed(3)})`);
    sg.addColorStop(1, "rgba(120,150,200,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(-60, -60, W + 120, 600);

    const gg = ctx.createLinearGradient(0, 980, 0, 1080);
    gg.addColorStop(0, "rgba(150,180,226,0)");
    gg.addColorStop(1, `rgba(150,180,226,${groundA.toFixed(3)})`);
    ctx.fillStyle = gg;
    ctx.fillRect(-60, 980, W + 120, 160);
  }

  // 雨（冷蓝灰底，闪电瞬间转冷银）
  drawRain(t, rainDensity, wind * 0.16, 0.20 + 0.10 * actB + 0.08 * actC, bolt);
  drawFog(t, actC * (0.7 + 0.3 * punchEnv(t, 20, 38, 0.2, 0.3)));
  drawEmbers(t, actC);
  drawGrain(frame);
  ctx.restore();

  // ---- 教堂：逆光剪影光学。闪电峰时天空亮，石墙只提一档仍近黑，
  //      真正亮的是窗洞；窗棂是亮窗上的深色石条 ----
  const lit = bolt;
  const wallA = (0.28 + lit * 0.26).toFixed(3);
  const wallR = Math.round(9 + lit * 43);
  const wallG = Math.round(13 + lit * 49);
  const wallB = Math.round(23 + lit * 67);
  masonry.forEach(el => {
    el.style.fill = `rgba(${wallR},${wallG},${wallB},${wallA})`;
  });
  windows.forEach(el => {
    el.style.fill = `rgba(196,214,255,${(lit * 0.72).toFixed(3)})`;
  });
  masonryLines.forEach(el => {
    el.style.stroke = `rgba(168,188,232,${(lit * 0.28).toFixed(3)})`;
  });
  // 棂条只在窗洞透光时出现（亮窗上的深色石条），窗灭则一起隐没
  windowBars.forEach(el => {
    el.style.stroke = `rgba(6,9,16,${(lit * 0.85).toFixed(3)})`;
  });

  // ---- 镜头：0-20s 花苞近景 → 20-36s 缓拉下移露出棺 → 37.45s 急推迎白闪 ----
  const pull = smooth(20, 36, t);
  let camS = 1.18 - 0.18 * pull;
  let camY = -50 + 140 * pull;   // 近景微露山墙；拉开终态完整露出棺椁
  const rush = smooth(37.45, 37.82, t);
  camS += 0.10 * rush;
  camY += -50 * rush;
  world.style.transform =
    `translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) ` +
    `translateY(${camY.toFixed(2)}px) scale(${camS.toFixed(4)})`;

  // 花苞自身的轻微呼吸
  const breathe = 1.0 + 0.012 * Math.sin(t * 1.1);
  rose.style.transform = `scale(${breathe.toFixed(4)})`;

  // ---- 花苞红光：A幕 lub-dub 双搏心跳；B幕压低；C幕持续灼烧 ----
  let heart = 0;
  if (t > 1.2 && t < 20) {
    const ph = (t - 1.2) % 2.15;
    heart = Math.exp(-Math.pow(ph - 0.10, 2) / 0.045) * 0.75
          + Math.exp(-Math.pow(ph - 0.42, 2) / 0.030) * 0.48;
    heart *= 1 - smooth(8.6, 9.4, t) * 0.55;   // 主闪来临前沉到最低点
    heart *= (1 - actC);
  }
  const red  = actC * (0.35 + 0.65 * punchEnv(t, 20, 37.7, 0.12, 0.4));
  glow.style.opacity = clamp01(0.04 + heart * 0.5 + red * 0.95).toFixed(3);

  // 冷闪时花苞压成窗前黑影（只走暗冷青线）；C 幕才允许亮红描边
  const cold = strike.glow * (0.5 + strike.core);
  const edgeLit = clamp01(cold * 0.9 + red);
  const edgeR = Math.round(58 + cold * 50 + red * 197);
  const edgeG = Math.round(16 + cold * 76);
  const edgeB = Math.round(26 + cold * 100);
  document.querySelectorAll(".rose-line,.rose-stroke,.stem,.leaf,.thorn")
    .forEach((el, i) => {
      const k = 0.55 + (i % 4) * 0.15;
      // A幕基线 .42 暗紫红：黑场后花形始终可辨；闪电时增量收窄防过曝
      const base = t < 9.5 ? 0.42 : 0.20;
      el.style.stroke =
        `rgba(${edgeR},${edgeG},${edgeB},${(base + edgeLit * k * 0.32).toFixed(3)})`;
    });

  // ---- 棺椁：拉开中淡入（20-24s），C 幕暗红描边，拍点脉冲 ----
  const coffinA = smooth(19.8, 24.2, t);
  coffin.style.opacity = coffinA.toFixed(3);
  const coffinPulse = punchEnv(t, 20, 37.7, 0.15, 0.4) * actC;
  // 棺体使用 SVG 内 coffinShade 渐变填充（弧面受光），此处只控淡入
  coffinBody.style.opacity = coffinA.toFixed(3);
  coffinEdge.style.stroke =
    `rgba(${130 + red * 90},${26 + coffinPulse * 60},${34 + red * 30},${(coffinA * (0.5 + red * 0.4)).toFixed(3)})`;
  coffinLine.style.stroke =
    `rgba(120,24,32,${(coffinA * (0.4 + coffinPulse * 0.3)).toFixed(3)})`;

  // ---- 雷闪中的少女背影：存在窗 9.6-19.4s（20.1 前必须清零，让棺椁接管）----
  // 峰闪整道黑影+冷青 rim 完整"现"形（2-3 帧）；指数余晖里 .3-.45 半透"若隐"
  // 约 0.6s 后沉入黑夜；无闪间隔不可见
  const stormWin = smooth(8.8, 9.6, t) * (1 - smooth(19.4, 20.1, t));
  const reveal = clamp01(strike.core * 1.0 + strike.glow * 0.85);
  stormGirl.style.opacity = (stormWin * reveal).toFixed(3);
  // 主光来自左前方教堂玫瑰窗/尖拱窗 → rimL 强、rimR 只留一线
  stormRimL.style.opacity =
    (stormWin * clamp01(strike.core * 0.95 + strike.glow * 0.8)).toFixed(3);
  stormRimR.style.opacity =
    (stormWin * clamp01(strike.core * 0.25 + strike.glow * 0.22)).toFixed(3);
  // 雨中极轻微的伫立晃动（纯函数）
  stormGirl.style.transform =
    `translateX(${(Math.sin(t * 0.9) * 1.2).toFixed(2)}px)`;

  // ---- 闪光层：冷闪峰压到 .30——只刺眼，不把黑夜照成白天 ----
  const flashCold = Math.min(0.30, strike.core * 0.34 + strike.glow * 0.05);
  const flashRed  = Math.min(0.4, red * punch * 0.35);
  // 37.75s 终极白闪：0.12s 拉满
  const finalFlash = smooth(37.72, 37.82, t);
  flashLayer.style.opacity = Math.max(flashCold, flashRed, finalFlash).toFixed(3);
  flashLayer.style.background =
    finalFlash > flashCold && finalFlash > flashRed ? "#fff"
    : flashRed > flashCold ? "#c20018" : "#dce8ff";

  // ---- 曲名铭文：24s 背板先入，装饰线展开，主标题上浮，33s 前退场 ----
  const titleIn  = smooth(24.2, 25.6, t);
  const titleOut = smooth(31.4, 33.0, t);
  const titleVis = titleIn * (1 - titleOut);
  titleBack.style.opacity = (smooth(24.0, 25.2, t) * (1 - titleOut) * 0.95).toFixed(3);
  titleCard.style.opacity = titleVis.toFixed(3);
  titleCard.style.transform =
    `translateY(${( (1 - titleIn) * 18).toFixed(2)}px)`;
  const lineProg = smooth(23.9, 24.9, t) * (1 - titleOut);
  decoL.style.transform = `scaleX(${lineProg.toFixed(3)})`;
  decoR.style.transform = `scaleX(${lineProg.toFixed(3)})`;
  diamond.style.transform =
    `rotate(45deg) scale(${(smooth(24.6, 25.2, t) * (1 - titleOut)).toFixed(3)})`;

  // ---- 黑场：开场 1s 褪黑（不再长时间全黑）----
  const fadeIn = 1 - smooth(0, 1.0, t);
  fadeBlack.style.opacity = fadeIn.toFixed(3);
}

// ---- GSAP：唯一一条主驱动 tween ----
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to(state, { t: 38, duration: 38, ease: "none", onUpdate: draw }, 0);
window.__timelines["intro"] = tl;
draw();
</script>
</body>
</html>
