<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pre1+Chorus1 Atmos — 雪 / 下沉微粒 / 余烬（53.93-107.28）</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  .clip { position: absolute; }
  #root { width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="root" data-composition-id="pc-atmos" data-width="1920" data-height="1080">
    <canvas id="atmos" class="clip" width="1920" height="1080"
            data-start="0" data-duration="53.35" data-track-index="0"
            data-layout-ignore></canvas>
  </div>

<script>
/* 大气是 t 的纯函数，随段落连续变质（不切池，靠包络过渡）：
   局部 0-12s    塔间细雪（斜落冷白），11.5s 沉沦开始后雪渐稀；
   局部 14.44-32 下沉：暗微粒上涌制造坠落速度感，颜色由冷灰转向暗红；
   局部 31.84-   落底毁灭之庭：红金余烬自水洼废墟持续上浮到曲段终。
   全部解析式 + 模 wrap，seek 任意帧一致。 */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
window.__timelines["pc-atmos"] = tl;

const canvas = document.getElementById("atmos");
const ctx = canvas.getContext("2d");
const W = 1920, H = 1080;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(7721);
const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = (a, b, x) => { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const wrap = (v, m) => ((v % m) + m) % m;

// 细雪
const snow = [];
for (let i = 0; i < 130; i++) {
  snow.push({
    x: rnd() * (W + 200) - 100,
    y: rnd() * (H + 80) - 40,
    len: 5 + rnd() * 9,
    vy: 95 + rnd() * 90,
    vx: -14 - rnd() * 16,
    a: .14 + rnd() * .3,
    ph: rnd() * 6.28
  });
}
// 下沉微粒（向上掠过）
const dust = [];
for (let i = 0; i < 82; i++) {
  dust.push({
    x: rnd() * W,
    y: rnd() * (H + 300),
    r: .8 + rnd() * 2.1,
    vy: 130 + rnd() * 170,
    sway: 8 + rnd() * 22,
    a: .12 + rnd() * .3,
    hot: rnd(),
    ph: rnd() * 6.28
  });
}
// 庭中余烬
const embers = [];
for (let i = 0; i < 38; i++) {
  embers.push({
    x: 120 + rnd() * 1680,
    period: 9 + rnd() * 11,       // 一粒火星从地面到熄灭的周期
    off: rnd(),                  // 周期相位
    vy: 34 + rnd() * 46,
    sway: 14 + rnd() * 30,
    r: 1.4 + rnd() * 2.2,
    warm: rnd()
  });
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  const snowEnv = 1 - smooth(11.4, 13.4, t);
  const dustEnv = smooth(13.6, 16.5, t) * (1 - smooth(31.9, 33.6, t));
  const emberEnv = smooth(31.9, 33.4, t);
  const redMix = smooth(14.44, 31.84, t);   // 下沉微粒冷→红

  // ---- 细雪（斜线段）----
  if (snowEnv > 0.01) {
    ctx.lineCap = "round";
    for (const s of snow) {
      const x = wrap(s.x + s.vx * t, W + 240) - 120;
      const y = wrap(s.y + s.vy * t, H + 120) - 60;
      const fl = .7 + .3 * Math.sin(t * 2 + s.ph);
      ctx.strokeStyle = `rgba(208,224,250,${(s.a * fl * snowEnv).toFixed(3)})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - s.vx * 0.045, y - s.vy * 0.045);
      ctx.stroke();
    }
  }

  // ---- 下沉微粒（向上）----
  if (dustEnv > 0.01) {
    for (const d of dust) {
      const y = H + 160 - wrap(d.y + d.vy * t, H + 460);
      const x = wrap(d.x + Math.sin(t * .9 + d.ph) * d.sway, W + 40) - 20;
      const rr = d.r * (1 + redMix * .3);
      const cr = Math.round(150 + 80 * redMix * d.hot);
      const cg = Math.round(170 - 120 * redMix * d.hot);
      const cb = Math.round(205 - 175 * redMix * d.hot);
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${(d.a * dustEnv).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, 6.283);
      ctx.fill();
    }
  }

  // ---- 庭中余烬（红金，自底部缓升、横向摇摆、近顶熄灭）----
  if (emberEnv > 0.01) {
    for (const e of embers) {
      const u = wrap(t / e.period + e.off, 1);   // 0 地面 → 1 熄灭
      const y = H + 30 - u * (H + 120);
      const x = e.x + Math.sin(u * 7 + e.off * 9) * e.sway;
      const life = Math.sin(u * Math.PI);         // 两端淡
      const rr = e.r * (1 + u * .8);
      const cr = 255, cg = Math.round(120 + 80 * e.warm * (1 - u)), cb = 50;
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${(life * emberEnv * .75).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, 6.283);
      ctx.fill();
    }
  }
}

const state = { t: 0 };
tl.to(state, { t: 53.35, duration: 53.35, ease: "none",
               onUpdate: () => draw(state.t) }, 0);
draw(0);
</script>
</body>
</html>
